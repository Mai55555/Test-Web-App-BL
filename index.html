<!DOCTYPE html>
<html>

<head>
<meta charset="utf-8">
<title>ESP32 BLE Control</title>
</head>

<body>

<h2>ESP32 BLE Control</h2>

<button onclick="connectBLE()">
Connect
</button>

<button onclick="ledOn()">
LED ON
</button>

<button onclick="ledOff()">
LED OFF
</button>

<button onclick="volumeUp()">
Volume +
</button>

<button onclick="volumeDown()">
Volume -
</button>

<script>

let characteristic;

const SERVICE_UUID =
"12345678-1234-1234-1234-1234567890ab";

const CHARACTERISTIC_UUID =
"87654321-4321-4321-4321-ba0987654321";

async function connectBLE() {

  const device =
    await navigator.bluetooth.requestDevice({
      filters: [{
          name: "ESP32-BLE"
      }],
      optionalServices: [SERVICE_UUID]
    });

  const server =
    await device.gatt.connect();

  const service =
    await server.getPrimaryService(
      SERVICE_UUID
    );

  characteristic =
    await service.getCharacteristic(
      CHARACTERISTIC_UUID
    );

  alert("Connected");
}

async function ledOn() {

  const encoder = new TextEncoder();

  await characteristic.writeValue(
    encoder.encode("ON")
  );
}

async function ledOff() {

  const encoder = new TextEncoder();

  await characteristic.writeValue(
    encoder.encode("OFF")
  );
}

async function volumeUp() {

  const encoder = new TextEncoder();

  await characteristic.writeValue(
    encoder.encode("VOL_UP")
  );
}

async function volumeDown() {

  const encoder = new TextEncoder();

  await characteristic.writeValue(
    encoder.encode("VOL_DOWN")
  );
}

</script>

</body>
</html>
